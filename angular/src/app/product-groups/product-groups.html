<div class="card">
  <div class="card-header">
    <div class="row align-items-center">
      <div class="col col-md-6">
        <h5 class="card-title">Product Groups</h5>
      </div>
      <div class="text-end col col-md-6">
        <button id="create" class="btn btn-primary" type="button" (click)="create()">
          <i class="fa fa-plus me-1"></i>
          <span>New Group</span>
        </button>
      </div>
    </div>
  </div>

  <div class="card-body">
    <ngx-datatable [rows]="productGroups.items" [count]="productGroups.totalCount" [list]="list" default>
      <ngx-datatable-column [name]="'::Actions' | abpLocalization" [maxWidth]="150" [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div ngbDropdown container="body" class="d-inline-block">
            <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" ngbDropdownToggle>
              Actions
            </button>
            <div ngbDropdownMenu>
              <button ngbDropdownItem (click)="edit(row.id)">Edit</button>
              <button ngbDropdownItem (click)="view(row.id)">View</button>
              <button ngbDropdownItem (click)="delete(row.id)">Delete</button>
            </div>
          </div>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column [name]="'Name'" prop="name"></ngx-datatable-column>
      <ngx-datatable-column [name]="'Code'" prop="code"></ngx-datatable-column>
      <ngx-datatable-column [name]="'Level'" prop="level"></ngx-datatable-column>
      <ngx-datatable-column [name]="'Parent'" prop="parentCode"></ngx-datatable-column>
      <ngx-datatable-column [name]="'Sort'" prop="sortOrder"></ngx-datatable-column>
      <ngx-datatable-column [name]="'Status'" prop="isActive">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <span class="badge" [ngClass]="row.isActive ? 'bg-success' : 'bg-secondary'">
            {{ row.isActive ? 'Active' : 'Inactive' }}
          </span>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column [name]="'Description'" prop="description">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <small class="text-muted">{{ row.description || '-' }}</small>
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>

<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <h3>{{ (selected.id ? 'Edit Group' : 'New Group') }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" id="group-form">
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label for="name">Name <span class="text-danger">*</span></label>
          <input id="name" class="form-control" formControlName="name" />
        </div>
        <div class="col-12 col-md-6">
          <label for="code">Code</label>
          <input id="code" class="form-control" formControlName="code" />
        </div>

        <div class="col-12 col-md-4">
          <label for="level">Level</label>
          <input type="number" id="level" class="form-control" formControlName="level" />
        </div>
        <div class="col-12 col-md-4">
          <label for="parent">Parent Code</label>
          <input id="parent" class="form-control" formControlName="parentCode" />
        </div>
        <div class="col-12 col-md-4">
          <label for="sort">Sort Order</label>
          <input type="number" id="sort" class="form-control" formControlName="sortOrder" />
        </div>

        <div class="col-12">
          <label for="description">Description</label>
          <textarea id="description" class="form-control" rows="3" formControlName="description"></textarea>
        </div>

        <div class="col-12 d-flex align-items-center">
          <div class="form-check form-switch mt-2">
            <input class="form-check-input" type="checkbox" id="active" formControlName="isActive" />
            <label class="form-check-label ms-2" for="active">Active</label>
          </div>
        </div>
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" abpClose>Cancel</button>
    <button *ngIf="!isViewMode" class="btn btn-primary" (click)="save()" [disabled]="form.invalid">Save</button>
  </ng-template>
</abp-modal>
