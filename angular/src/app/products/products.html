<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">Quản lý Sản phẩm</h5>
      </div>
      <div class="text-end col col-md-6">
        <button id="create" class="btn btn-primary" type="button" (click)="createProduct()">
          <i class="fa fa-plus me-1"></i> Thêm mới
        </button>
      </div>
    </div>
  </div>
  
  <div class="card-body">
    <ngx-datatable
      [rows]="product.items"
      [count]="product.totalCount"
      [list]="list"
      default>
      
      <ngx-datatable-column
        [name]="'::Actions' | abpLocalization"
        [maxWidth]="150"
        [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div ngbDropdown container="body" class="d-inline-block">
            <button class="btn btn-primary btn-sm dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" ngbDropdownToggle>
              <i class="fa fa-cog me-1"></i> Hành động
            </button>
            <div ngbDropdownMenu>
              <button ngbDropdownItem (click)="editProduct(row.id)">Sửa</button>
              <button ngbDropdownItem (click)="delete(row.id)">Xóa</button>
            </div>
          </div>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column name="Tên sản phẩm" prop="name"></ngx-datatable-column>
      <ngx-datatable-column name="Giá" prop="price">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row.price | currency }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Tồn kho" prop="stock"></ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>

<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <h3>{{ (selectedProduct.id ? '::Edit' : '::New') | abpLocalization }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="mt-2">
        <label for="product-name">Tên sản phẩm</label><span> * </span>
        <input type="text" id="product-name" class="form-control" formControlName="name" autofocus />
      </div>

      <div class="mt-2">
        <label for="product-price">Giá</label><span> * </span>
        <input type="number" id="product-price" class="form-control" formControlName="price" />
      </div>

      <div class="mt-2">
        <label for="product-stock">Tồn kho</label>
        <input type="number" id="product-stock" class="form-control" formControlName="stock" />
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" abpClose>Hủy</button>
    <button class="btn btn-primary" (click)="save()" [disabled]="form.invalid">Lưu</button>
  </ng-template>
</abp-modal>
